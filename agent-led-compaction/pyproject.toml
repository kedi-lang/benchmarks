[project]
name = "kedi-agent-compaction"
version = "0.1.0"
description = "Can an agent compact its own context better than its provider? An experiment on Kedi."
requires-python = "==3.12.*"
dependencies = [
    "kedi[codex-model]",
    # Kedi at 833ce44, which the runs used, imports Pydantic AI's Anthropic model in its native
    # compaction path, also for OpenAI models. A later Kedi commit fixes that ("fix: native
    # compaction imports only the model's own provider"); with it, this dependency can go.
    "anthropic",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
# The harness runs from this folder (python -m agent_compaction.run); nothing is built.
package = false

[tool.uv.sources]
kedi = { git = "https://github.com/kedi-lang/kedi.git", rev = "833ce44c46ad8279d2eb74324988ecca79714c21" }

[tool.pytest.ini_options]
# The harness is imported from this folder, which plain `pytest` does not put on sys.path.
pythonpath = ["."]
testpaths = ["tests"]
